# ============================================================
#  Sanatify MES - Gradle settings (optimized for FAST builds)
# ============================================================

# --- JDK bundled with Android Studio (do not remove) ---
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# --- Gradle daemon & performance ---
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dsun.net.inetaddr.negative.ttl=0 -Dsun.net.inetaddr.ttl=30

# --- AndroidX ---
android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true
android.extraMavenRepos=[]

# --- Architectures: ONLY real-device ABI (x86/x86_64 are emulator-only) ---
# For very old 32-bit phones, change to: arm64-v8a,armeabi-v7a
reactNativeArchitectures=arm64-v8a

# --- React Native / Expo ---
newArchEnabled=false
hermesEnabled=true
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false
expo.useLegacyPackaging=false
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# --- Kotlin (daemon = faster incremental builds) ---
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvm.options=-Xmx2g

# --- Network timeouts (kept for offline / local-mirror safety) ---
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000
# prevent long hangs on blocked repositories
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=30000